# PS5SX3: the settings the title ships for the PS5 section of ps5.yml, most of them for one game (TB8).
# Your own rpcs3/config/ps5.yml goes over this file key by key: a key you set there wins. Three add up instead:
#   Freeze and SPU Approximate Programs (your entries are added to these) and Title Steps (a game you name gets your steps).
# GTA IV EU's density, blur and draw-distance values are no longer Freeze entries here: they are cheats the title ships (cheats/ next to
# eboot.bin), on by default, which the home menu's Cheats turns off (docs/PS5_CHEATS.md, "Shipped cheats").
# This file is replaced at every update: put your own settings in rpcs3/config/ps5.yml, not here.
# Made by tools from the test console's own files (TB1's ps5.yml and the GTA IV EU settings), not typed.
PS5:
  # TB8: frame generation's Auto (Settings > Display > Frame generation; the default while your ps5.yml does not set Frame Generation) leaves
  # it off on a display below 100 Hz for these games: on three or more testers' consoles each they run at a real 59.8 frames a second without
  # it (the same or better 1% lows, no more crashes), where frame generation holds them at 30 real frames. From the testers' session logs, by
  # rps5s3-agent/tuning/best_settings.py (PROPOSALS.md); the list grows as the logs show more games. Your own key replaces the list whole.
  # Mortal Kombat Komplete Edition; Tekken Tag Tournament 2; Tekken 6; Minecraft; Top Spin 4; Soulcalibur IV; Guitar Hero III.
  Frame Generation Auto Off: "BLUS30902 BLES01702 BLJS10187 BLUS31002 NPEB01140 BLES00635 BLUS30359 BLES01976 BLUS31426 BLES00668 BLUS30427 BLES00296 BLUS30160 BLES00134 BLUS30074"
  # Faster SPU float maths (Approximate) for the SPU programs measured safe on the test console: GTA IV's audio and jobs, in every
  # version (the same SPU programs; with one-digit prefixes, half of each version's programs), and Call of Duty: Modern Warfare 2.
