Version: 1.2

# PS5SX3's own patches: the ones RPCS3's patch database (patch.yml next to this file, shipped byte for byte) does not have. The title loads
# this file after the database (ps5/platform/ps5_patch_defaults.cpp, ps5_append_shipped_patches), and the patches that are on by default
# are in ps5sx3_patch_defaults.tsv, under the person's own config/patch_config.yml as the database's are. A patch of the same name in
# one of the person's own patch files wins over this one, as over the database's (RPCS3 keeps the higher patch version, the person's
# when they are equal).

# Grand Theft Auto IV (BLUS30127, BLUS30682, NPUB30702): lets the game run on SPU XFloat Accuracy "Approximate" (its shipped settings,
# game_configs) without falling through the world. ARMSX3's "Approximate collision fix" by jpolo1224 (github.com/ARMSX2/ARMSX3,
# canary_patches.yml, GPL-2.0), as Lucidic15's GTA IV fix ships it (github.com/Lucidic15/ps5sx3-gta4-fix, 2026-10-14), unchanged.
#
# The collision job SpuCollide_psn_final.task.elf starts its searches with 0x7FFFFFFF, the SPU's largest float. On Approximate that
# value is a NaN, so the search stops before it finds the ground. These 14 lines load 0x7F7FFFFF (FLT_MAX) instead, a number on both
# settings, so the patch is harmless on Accurate. Offsets are SPU local storage addresses.
#
# Made for the executable of BLUS30682 v01.02 and BLUS30127 / NPUB30702 v01.08. The hash names that one collision program, so on any
# other version nothing is patched: RPCS3.log then shows SpuCollide's "SPU executable hash" without "(<- 14)".
SPU-d0a1508208613e2184fbd64906d34d5f07890033:
  "ARMSX3 Approximate collision fix":
    Games:
      "Grand Theft Auto IV":
        BLUS30127: [ All ]
        BLUS30682: [ All ]
        NPUB30702: [ All ]
    Author: "jpolo1224 (ARMSX3)"
    Notes: "Lets the game run with SPU XFloat Accuracy on Approximate without falling through the world."
    Patch Version: 1.0
