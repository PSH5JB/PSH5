# SOCOM II: U.S. Navy SEALs (SCUS-97275)
# 6x. Widescreen comes from gs.ini's EnableWideScreenPatches and patches/SCUS-97275_0F6FC6CF.pnach.
upscale_multiplier=6
# Online (PS Rewired): PCSX2's network adapter through the console's sockets, with DHCP from PCSX2.
# In the game's network configuration, set the primary DNS by hand to PS Rewired's 67.222.156.250.
DEV9/Eth/EthEnable=true
DEV9/Eth/EthApi=Sockets
DEV9/Eth/EthDevice=Auto
DEV9/Eth/InterceptDHCP=true
DEV9/Eth/EthLogDHCP=true
DEV9/Eth/EthLogDNS=true
# patches/SCUS-97275_0F6FC6CF.pnach: turn on its [60 FPS] group
Patches/Enable=60 FPS
# cheats/0F6FC6CF.pnach, PS Rewired's DNAS bypass (Harry62): turn on its one group
EmuCore/EnableCheats=true
Cheats/Enable=General Cheats\DNAS Bypass
# PS Rewired's DNS, handed to the game by PCSX2's DHCP (vk-285-54 and later read the address as text)
DEV9/Eth/ModeDNS1=Manual
DEV9/Eth/DNS1=67.222.156.250
# 2026-09-26: PS Rewired kicked the user for the widescreen patch, so it is off for this game.
# The settings page's Widescreen toggle turns it back on for offline play (then restart the game).
EmuCore/EnableWideScreenPatches=false
AspectRatio=16:9
