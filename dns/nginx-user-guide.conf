server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name manuals.playstation.net manuals.sonyentertainmentnetwork.com _;

    ssl_certificate     /etc/ssl/certs/psh5jb.crt;
    ssl_certificate_key /etc/ssl/private/psh5jb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/psh5;
    index index.html;

    # User Guide is /document/<lang>/ps5/... so ./logo.jpg and ./src/*.js
    # would 404 unless that prefix is stripped.
    rewrite ^/document/[^/]+/ps5/current/?(.*)$ /$1 last;
    rewrite ^/document/[^/]+/ps5/?(.*)$ /$1 last;
    rewrite ^/document/[^/]+/?(.*)$ /$1 last;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
