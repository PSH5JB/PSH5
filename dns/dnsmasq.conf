# Replace every YOUR_IP with this machine's address (the one the PS5 can reach).
domain-needed
bogus-priv
no-resolv
no-hosts
server=1.1.1.1
server=1.0.0.1
bind-interfaces
listen-address=YOUR_IP
listen-address=127.0.0.1

# Block PSN (sign-in, store, trophies) and system updates.
# Empty address = NXDOMAIN for A and AAAA. More-specific names below win.
address=/playstation.net/
address=/playstation.com/
address=/playstation.org/
address=/sonyentertainmentnetwork.com/
address=/scea.com/
address=/sie.com/
address=/psndl.net/

# User Guide → this host (more specific than the playstation.net block)
address=/manuals.playstation.net/YOUR_IP
address=/manuals.sonyentertainmentnetwork.com/YOUR_IP
