# Replace every YOUR_IP with this machine's address (the one the PS5 can reach).
domain-needed
bogus-priv
no-resolv
no-hosts
server=1.1.1.1
server=1.0.0.1
bind-interfaces
listen-address=YOUR_IP
listen-address=127.0.0.1

# User Guide → this host
address=/manuals.playstation.net/YOUR_IP
address=/manuals.sonyentertainmentnetwork.com/YOUR_IP

# Block PS5 system updates
address=/update.playstation.net/0.0.0.0
address=/djsv.playstation.net/0.0.0.0
address=/fus01.ps5.update.playstation.net/0.0.0.0
address=/fau01.ps5.update.playstation.net/0.0.0.0
address=/duc01.pp.update.playstation.net/0.0.0.0
address=/cau01.ps5.update.playstation.net/0.0.0.0
address=/b.appl.playstation.net/0.0.0.0
address=/ps4updptl.playstation.net/0.0.0.0
address=/ps5updptl.playstation.net/0.0.0.0
