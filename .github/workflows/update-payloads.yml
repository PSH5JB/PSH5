name: Update Payloads

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-payloads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and download updated payloads
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_payloads.py

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads/ src/kexp.js .github/payload-versions.json
          UPDATED=$(git diff --cached --name-only -- payloads/ | sed 's|payloads/||' | sort | paste -sd ', ')
          git commit -m "chore: update payloads — ${UPDATED}

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
          git push

      - name: Deploy to VPS
        if: steps.update.outputs.changed == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@167.99.91.255 \
            "cd /var/www/html && git stash && git pull origin main && git stash drop 2>/dev/null || true"
