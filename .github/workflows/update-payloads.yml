name: Update Payloads

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download latest kstuff.elf
        run: |
          URL=$(curl -s https://api.github.com/repos/EchoStretch/kstuff-lite/releases/latest \
            | jq -r '.assets[] | select(.name == "kstuff.elf") | .browser_download_url')
          curl -L "$URL" -o payloads/kstuff.elf
          echo "kstuff: $URL"

      - name: Download latest shadowmountplus.elf
        run: |
          URL=$(curl -s https://api.github.com/repos/drakmor/ShadowMountPlus/releases/latest \
            | jq -r '.assets[] | select(.name == "shadowmountplus.elf") | .browser_download_url')
          curl -L "$URL" -o payloads/shadowmountplus.elf
          echo "shadowmountplus: $URL"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads/kstuff.elf payloads/shadowmountplus.elf
          if git diff --cached --quiet; then
            echo "No payload updates."
          else
            git commit -m "chore: update payloads from upstream releases"
            git push
          fi
